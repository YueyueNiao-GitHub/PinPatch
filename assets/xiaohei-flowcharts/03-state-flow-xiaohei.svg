    .label { font: 600 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #182230; dominant-baseline: middle; }
    .edge-label { font: 600 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475467; paint-order: stroke; stroke: #F8FAFC; stroke-width: 5px; }
  </style>
  <rect x="0" y="0" width="1180" height="470" fill="#F8FAFC"/>
  <text x="48" y="54" class="title">标注状态流：一条反馈就是一张轻量 issue</text>
  <text x="48" y="82" class="subtitle">状态管理的意思：每条页面反馈都有自己的处理进度</text>
  <line x1="155" y1="250" x2="215" y2="250" stroke="#344054" stroke-width="2.1" marker-end="url(#arrow)"/><text x="185" y="241" text-anchor="middle" class="edge-label">选中</text>
  <line x1="385" y1="250" x2="437.5" y2="250" stroke="#344054" stroke-width="2.1" marker-end="url(#arrow)"/><text x="411.25" y="241" text-anchor="middle" class="edge-label">创建</text>
  <line x1="612.5" y1="250" x2="670" y2="250" stroke="#344054" stroke-width="2.1" marker-end="url(#arrow)"/><text x="641.25" y="241" text-anchor="middle" class="edge-label">处理</text>
  <line x1="870" y1="250" x2="910" y2="165" stroke="#344054" stroke-width="2.1" marker-end="url(#arrow)"/><text x="890" y="198.5" text-anchor="middle" class="edge-label">完成</text>
  <line x1="670" y1="250" x2="612.5" y2="250" stroke="#344054" stroke-width="2.1" marker-end="url(#arrow)"/><text x="641.25" y="241" text-anchor="middle" class="edge-label">补充</text>
  <line x1="612.5" y1="250" x2="910" y2="335" stroke="#344054" stroke-width="2.1" marker-end="url(#arrow)"/><text x="761.25" y="283.5" text-anchor="middle" class="edge-label">忽略</text>
  <rect x="65" y="218" width="90" height="64" rx="10" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/><text x="110" y="250" text-anchor="middle" class="label">开始</text>
  <rect x="215" y="212" width="170" height="76" rx="10" fill="#FFFFFF" stroke="#98A2B3" stroke-width="2"/><text x="300" y="250" text-anchor="middle" class="label">草稿：选中元素</text>
  <rect x="437.5" y="212" width="175" height="76" rx="10" fill="#FFF6ED" stroke="#FDB022" stroke-width="2"/><text x="525" y="250" text-anchor="middle" class="label">待处理：已创建</text>
  <rect x="670" y="212" width="200" height="76" rx="10" fill="#EEF4FF" stroke="#84ADFF" stroke-width="2"/><text x="770" y="250" text-anchor="middle" class="label">处理中：交给智能体</text>
  <rect x="910" y="127" width="180" height="76" rx="10" fill="#ECFDF3" stroke="#32D583" stroke-width="2"/><text x="1000" y="165" text-anchor="middle" class="label">已处理：用户确认</text>
  <rect x="910" y="297" width="180" height="76" rx="10" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/><text x="1000" y="335" text-anchor="middle" class="label">已忽略：关闭标注</text>
