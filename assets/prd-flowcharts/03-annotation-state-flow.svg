<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="480" viewBox="0 0 1160 480">
  
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344054"/>
    </marker>
  </defs>
  <style>
    .title { font: 700 28px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #101828; }
    .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #667085; }
    .label { font: 600 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #182230; dominant-baseline: middle; }
    .edge-label { font: 600 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475467; paint-order: stroke; stroke: #F8FAFC; stroke-width: 5px; }
  </style>
  <rect x="0" y="0" width="1160" height="480" fill="#F8FAFC"/>
  <text x="48" y="54" class="title">标注状态流</text>
  <text x="48" y="82" class="subtitle">每条页面反馈都是一条轻量 issue，状态用于跟踪问题是否处理</text>
  <line x1="155" y1="230" x2="200" y2="230" stroke="#344054" stroke-width="2.2" marker-end="url(#arrow)"/><text x="177.5" y="220" text-anchor="middle" class="edge-label">选中元素</text>
  <line x1="380" y1="230" x2="425" y2="230" stroke="#344054" stroke-width="2.2" marker-end="url(#arrow)"/><text x="402.5" y="220" text-anchor="middle" class="edge-label">创建标注</text>
  <line x1="615" y1="230" x2="665" y2="230" stroke="#344054" stroke-width="2.2" marker-end="url(#arrow)"/><text x="640" y="220" text-anchor="middle" class="edge-label">交给智能体</text>
  <line x1="855" y1="230" x2="895" y2="150" stroke="#344054" stroke-width="2.2" marker-end="url(#arrow)"/><text x="875" y="180" text-anchor="middle" class="edge-label">确认完成</text>
  <line x1="665" y1="230" x2="615" y2="230" stroke="#344054" stroke-width="2.2" marker-end="url(#arrow)"/><text x="640" y="220" text-anchor="middle" class="edge-label">需补充</text>
  <line x1="615" y1="230" x2="895" y2="320" stroke="#344054" stroke-width="2.2" marker-end="url(#arrow)"/><text x="755" y="265" text-anchor="middle" class="edge-label">忽略</text>
  <rect x="65" y="198" width="90" height="64" rx="14" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/><text x="110" y="230" text-anchor="middle" class="label">开始</text>
  <rect x="200" y="192" width="180" height="76" rx="14" fill="#ffffff" stroke="#98A2B3" stroke-width="2"/><text x="290" y="230" text-anchor="middle" class="label">草稿：已选中元素</text>
  <rect x="425" y="192" width="190" height="76" rx="14" fill="#FFF6ED" stroke="#FDB022" stroke-width="2"/><text x="520" y="230" text-anchor="middle" class="label">待处理：已创建标注</text>
  <rect x="665" y="192" width="190" height="76" rx="14" fill="#EEF4FF" stroke="#84ADFF" stroke-width="2"/><text x="760" y="230" text-anchor="middle" class="label">处理中：交给智能体</text>
  <rect x="895" y="112" width="170" height="76" rx="14" fill="#ECFDF3" stroke="#32D583" stroke-width="2"/><text x="980" y="150" text-anchor="middle" class="label">已处理：用户确认</text>
  <rect x="895" y="282" width="170" height="76" rx="14" fill="#F2F4F7" stroke="#98A2B3" stroke-width="2"/><text x="980" y="320" text-anchor="middle" class="label">已忽略：关闭标注</text>
</svg>