<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PinPatch Patch Matrix</title>
  <desc id="desc">A page grid with one precise patch pulled into focus.</desc>
  <defs>
    <rect id="tile" width="14" height="14" rx="4"/>
  </defs>
  <g fill="currentColor">
    <use href="#tile" x="24" y="24" opacity=".22"/>
    <use href="#tile" x="43" y="24" opacity=".22"/>
    <use href="#tile" x="62" y="24" opacity=".22"/>
    <use href="#tile" x="24" y="43" opacity=".22"/>
    <use href="#tile" x="62" y="43" opacity=".22"/>
    <use href="#tile" x="24" y="62" opacity=".22"/>
    <use href="#tile" x="43" y="62" opacity=".22"/>
    <use href="#tile" x="62" y="62" opacity=".22"/>
    <rect x="40" y="40" width="20" height="20" rx="6"/>
    <path d="M50 58v17l8-8" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
